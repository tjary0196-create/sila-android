name: Android CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Restored debug.keystore from secret."
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore (no secret found)."
          fi
          echo "===== SHA-1 fingerprint ====="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
          echo "===== Base64 of keystore (save as DEBUG_KEYSTORE_BASE64 secret) ====="
          base64 -w0 ~/.android/debug.keystore

      - name: Prepare Firebase credentials and local.properties from GitHub Secrets
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_WEB_CLIENT_ID: ${{ secrets.FIREBASE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$FIREBASE_JSON" ]; then
            echo "Missing FIREBASE_GOOGLE_SERVICES_JSON secret."
            exit 1
          fi
          if [ -z "$FIREBASE_WEB_CLIENT_ID" ]; then
            echo "Missing FIREBASE_WEB_CLIENT_ID secret."
            exit 1
          fi

          mkdir -p app
          printf '%s' "$FIREBASE_JSON" > app/google-services.json
          echo "Wrote app/google-services.json from secret."

          printf 'FIREBASE_WEB_CLIENT_ID=%s\n' "$FIREBASE_WEB_CLIENT_ID" > local.properties
          echo "Wrote local.properties with FIREBASE_WEB_CLIENT_ID."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.2
          cache-disabled: true

      - name: Build Debug APK
        run: gradle clean assembleDebug --no-daemon --no-build-cache --rerun-tasks
        env:
          JAVA_TOOL_OPTIONS: "-Xmx2g"

      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sila-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
